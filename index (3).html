<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

 <title>My College ID Card</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="card-container">
 <div class="id-card">
  <header class="card-header">
  <img src="/id card/college logo.jpg"
     alt="College Logo" width="100"
     class="logo">
 <h3>PRAGNYA DEGREE COLLEGE</h3>
 <p>(Autonomous)</p>
 </header>
 <div class="photo-wrap">
<img src="/id card/photo.jpg"
  alt="Profile Photo" width="100"
  class="photo">
  </div>
   <main class="card-body">
 <div class="name-section">
 <h2 class="student-name">
  sujini
   </h2>
   <p class="college">  Pragnya Degree College
  </p>
   </div>
<hr class="divider">
<div class="details">
  <p>
 <strong>Course:</strong> BCA  </p>
 <p>
 <strong>Birthdate:</strong> DD-MM-YYYY
 </p>
  </div>
  <div class="id-line">
 <span class="id-label">ID No.:</span>
  <span class="id-value">YOUR ID NUMBER</span>
  </div>
  <div class="barcode"></div>
  </main>
  <footer class="card-footer">
  <p class="footer-text">
   Issued by: Pragnya Degree College
  </p>
  </footer>
 </div>
  </div>
</body>
</html>
